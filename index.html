<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<title>TV Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one column, composer pinned at the bottom like a messaging app; list above. */
:root {
  --bg: #f3f1ee; --surface: #ffffff; --surface-2: #ebe8e3; --fg: #1b1c22; --muted: #6b6a72; --line: #dcd8d1;
  --accent: #2f5bd6; --onaccent: #fff; --danger: #c43d3d;
  --c-yellow: #e9b008; --c-blue: #3a78f2; --c-pink: #e0559a; --c-green: #23a865; --c-red: #e2483d; --c-plain: #9a98a3;
  --font: "Figtree", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root { --bg: #111217; --surface: #1c1d24; --surface-2: #26272f; --fg: #f1f0ee; --muted: #9b9aa4; --line: #2f3039; --accent: #6f95ff; --onaccent: #0d0f17; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
.who { display: flex; align-items: center; gap: 8px; border: 0; background: var(--surface-2); color: var(--fg); padding: 6px 12px 6px 6px; border-radius: 999px; font: 600 14px var(--font); }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; }
.status { font-size: 13px; color: var(--muted); margin: 6px 0 14px; min-height: 18px; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c-green); margin-right: 6px; vertical-align: 1px; }
.status.bad .dot { background: var(--c-red); }
ul { list-style: none; margin: 0; padding: 0 0 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
li { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border-radius: 16px; padding: 12px 12px 12px 0; border: 1px solid var(--line); overflow: hidden; }
li .edge { width: 6px; align-self: stretch; border-radius: 0 4px 4px 0; flex: 0 0 auto; }
li .mark { flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; display: grid; place-items: center; }
li .bullet { width: 8px; height: 8px; border-radius: 50%; }
li .check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); background: transparent; padding: 0; display: grid; place-items: center; color: #fff; }
li.done .check { border-color: transparent; }
li .body { flex: 1; min-width: 0; }
li .text { font-size: 17px; font-weight: 600; word-wrap: break-word; }
li.note .text { font-weight: 500; }
li.done .text { text-decoration: line-through; color: var(--muted); }
li .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
li .del { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.tools { display: flex; justify-content: flex-end; margin-bottom: 8px; }
.link { border: 0; background: none; color: var(--accent); font: 600 14px var(--font); padding: 6px 4px; }
.composer { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--fg); font: 600 14px var(--font); padding: 7px 12px; border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.swatches { display: flex; gap: 8px; margin-left: auto; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.input { display: flex; gap: 8px; }
.input input { flex: 1; min-width: 0; font: 17px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.input button, .primary { border: 0; background: var(--accent); color: var(--onaccent); font: 700 16px var(--font); border-radius: 14px; padding: 0 18px; min-height: 46px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lock { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-bottom: 20vh; }
.lock p { color: var(--muted); margin: 0; }
.people { display: flex; gap: 10px; flex-wrap: wrap; }
.people button { flex: 1; min-width: 140px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 700 16px var(--font); padding: 12px; border-radius: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 18px; }
li.img { flex-direction: column; align-items: stretch; padding: 10px; gap: 8px; }
li.img img { width: 100%; border-radius: 10px; display: block; background: #1d1f27; }
li.img .imgmeta { display: flex; justify-content: space-between; align-items: center; }
.drawbtn { border: 0; background: var(--surface-2); color: var(--fg); font: 600 14px var(--font); padding: 7px 12px; border-radius: 12px; }
.pad { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); }
.pad-top { display: flex; justify-content: space-between; align-items: center; }
.pad canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 16px; background: #1d1f27; touch-action: none; display: block; }
.pad .row { justify-content: space-between; }
.pens { display: flex; gap: 10px; flex-wrap: wrap; }
.pen { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; }
.pen[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.sizes { display: flex; gap: 6px; }
.sizes button { width: 40px; height: 34px; border: 0; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; }
.sizes button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.sizes span { display: block; border-radius: 50%; background: var(--fg); }
.ghost { border: 0; background: var(--surface-2); color: var(--fg); font: 600 15px var(--font); padding: 10px 14px; border-radius: 12px; }
@media (prefers-reduced-motion: no-preference) { li { animation: in .18s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="nacl-fast.min.js?v=1793132082"></script>
<script src="nacl-util.min.js?v=1793132082"></script>
<script src="notes-core.js?v=1793132082"></script>
<script src="ask.js?v=1793132082"></script>
<script>
(function () {
  'use strict';
  var VERSION = '1793132082';
  // Reload when a newer page has been published (Home Screen apps otherwise keep an old copy).
  function checkUpdate() {
    if (typeof fetch !== 'function') return;
    fetch(location.pathname + 'version.txt?_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (v) {
        v = (v || '').trim(); if (!v || v === VERSION) return;
        // Reload once per new version, with the version in the address so the cache can't serve the old page.
        if (ls('tvn-reloaded') === v) return;
        ls('tvn-reloaded', v);
        var q = location.search.replace(/[?&]v=[^&]*/g, '').replace(/^&/, '?');
        location.replace(location.pathname + (q && q !== '?' ? q + '&' : '?') + 'v=' + v);
      }).catch(function () {});
  }
  var PEOPLE = [{ name: 'Preetham', color: '#3a78f2' }, { name: 'Krishna Priya', color: '#e0559a' }];
  var COLORS = { yellow: 'var(--c-yellow)', blue: 'var(--c-blue)', pink: 'var(--c-pink)', green: 'var(--c-green)', red: 'var(--c-red)' };
  var MAX_ITEMS = 25, MAX_LEN = 140;
  var app = document.getElementById('app');
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  // A personal link carries the passcode and name after '#' (never sent to any server).
  (function () {
    var h = {}; ((location.search || '').replace(/^\?/, '') + '&' + (location.hash || '').replace(/^#/, '')).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ''); });
    if (h.k) ls('tvn-pass', h.k.trim().toLowerCase());
    if (h.me) ls('tvn-me', h.me);
  })();
  var pass = ls('tvn-pass'), me = ls('tvn-me'), cfg = pass ? TVNotes.derive(pass) : null;
  var state = null, lastSync = 0, syncErr = false, kind = ls('tvn-kind') || 'todo', color = ls('tvn-color') || 'yellow', busy = false;
  try { state = JSON.parse(ls('tvn-cache') || 'null'); } catch (e) {}
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function person(n) { for (var i = 0; i < PEOPLE.length; i++) if (PEOPLE[i].name === n) return PEOPLE[i]; return { name: n || '?', color: '#888' }; }
  function ago(ms) { var m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' hr ago'; }

  function renderLock() {
    app.innerHTML = '<div class="lock"><h1>TV Notes</h1><p>Enter your household passcode. You only need to do this once on this phone.</p>' +
      '<form class="input" id="pf"><input id="pin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="passcode"><button>Unlock</button></form><div class="err" id="perr"></div></div>';
    document.getElementById('pf').onsubmit = function (e) {
      e.preventDefault();
      var v = document.getElementById('pin').value.trim().toLowerCase();
      if (v.split('-').length < 4) { document.getElementById('perr').textContent = 'That doesn’t look like your passcode. It has four words and a number, joined by dashes.'; return; }
      ls('tvn-pass', v); pass = v; cfg = TVNotes.derive(v); state = null; ls('tvn-cache', null); keepHash(); start();
    };
  }
  function renderWho() {
    app.innerHTML = '<div class="lock"><h1>Who’s this?</h1><p>Notes you add will be marked with your color.</p><div class="people">' +
      PEOPLE.map(function (p, i) { return '<button data-i="' + i + '"><span class="av" style="background:' + p.color + '">' + p.name[0] + '</span>' + esc(p.name) + '</button>'; }).join('') + '</div></div>';
    [].forEach.call(app.querySelectorAll('.people button'), function (b) { b.onclick = function () { me = PEOPLE[+b.dataset.i].name; ls('tvn-me', me); keepHash(); renderMain(); }; });
  }
  function renderMain() {
    var p = person(me), items = (state && state.items) || [];
    var draft = (document.getElementById('txt') || {}).value || '';
    app.innerHTML =
      '<header><h1>TV Notes</h1><button class="link" id="watch" style="margin-left:auto">Watch</button><button class="who" id="who"><span class="av" style="background:' + p.color + '">' + esc(p.name[0]) + '</span>' + esc(p.name) + '</button></header>' +
      '<div class="status' + (syncErr ? ' bad' : '') + '" id="st"></div>' +
      (items.some(function (i) { return i.d; }) ? '<div class="tools"><button class="link" id="clr">Clear completed</button></div>' : '') +
      (items.length ? '<ul id="list">' + items.map(function (it, idx) {
        var col = COLORS[it.c] || 'var(--c-plain)', author = person(it.a);
        if (it.t === 'img') return '<li class="img"><img alt="Drawing by ' + esc(author.name) + '" src="' + it.img + '"><div class="imgmeta"><span class="meta">✏️ ' + esc(author.name.split(' ')[0]) + ' · ' + ago(it.ts) + '</span><button class="del" data-act="del" data-i="' + idx + '" aria-label="Delete drawing">×</button></div></li>';
        var mark = it.t === 'todo' ? '<button class="check" data-act="tog" data-i="' + idx + '" aria-label="' + (it.d ? 'Mark not done' : 'Mark done') + '" style="' + (it.d ? 'background:' + col : '') + '">' + (it.d ? '✓' : '') + '</button>'
          : it.t === 'bullet' ? '<span class="bullet" style="background:' + col + '"></span>' : '';
        return '<li class="' + it.t + (it.d ? ' done' : '') + '"><span class="edge" style="background:' + col + '"></span><span class="mark">' + mark + '</span>' +
          '<div class="body"><div class="text">' + esc(it.x) + '</div><div class="meta">' + esc(author.name.split(' ')[0]) + ' · ' + ago(it.ts) + '</div></div>' +
          '<button class="del" data-act="del" data-i="' + idx + '" aria-label="Delete">×</button></li>';
      }).join('') + '</ul>' : '<ul><div class="empty">Nothing on the TV yet. Add a note below.</div></ul>') +
      '<div class="composer"><div class="row"><div class="seg" role="group" aria-label="Type">' +
      [['note', 'Note'], ['bullet', '• Bullet'], ['todo', '☐ To-do']].map(function (k) { return '<button data-k="' + k[0] + '" aria-pressed="' + (kind === k[0]) + '">' + k[1] + '</button>'; }).join('') +
      '</div><button class="drawbtn" id="drawbtn">✏️ Draw</button><div class="swatches" role="group" aria-label="Color">' +
      Object.keys(COLORS).map(function (c) { return '<button class="sw" data-c="' + c + '" aria-label="' + c + '" aria-pressed="' + (color === c) + '" style="background:' + COLORS[c] + '"></button>'; }).join('') +
      '</div></div><form class="input" id="f"><input id="txt" maxlength="' + MAX_LEN + '" placeholder="Add to the TV…" autocomplete="off" enterkeyhint="send"><button>Add</button></form></div>';
    var t = document.getElementById('txt'); t.value = draft;
    showStatus();
    document.getElementById('drawbtn').onclick = openPad;
    document.getElementById('watch').onclick = function () { TVAsk.open({ pass: pass, me: me, back: function () { TVAsk.active = false; renderMain(); } }); };
    document.getElementById('who').onclick = function () { ls('tvn-me', null); me = null; renderWho(); };
    [].forEach.call(app.querySelectorAll('.seg button'), function (b) { b.onclick = function () { kind = b.dataset.k; ls('tvn-kind', kind); renderMain(); }; });
    [].forEach.call(app.querySelectorAll('.sw'), function (b) { b.onclick = function () { color = b.dataset.c; ls('tvn-color', color); renderMain(); }; });
    var clr = document.getElementById('clr'); if (clr) clr.onclick = function () { change(function (s, now) { s.items.forEach(function (i) { if (i.d) s.gone[i.id] = now; }); }); };
    [].forEach.call(app.querySelectorAll('[data-act]'), function (b) {
      b.onclick = function () {
        var i = +b.dataset.i, id = items[i] && items[i].id;
        change(function (s, now) {
          s.items.forEach(function (it) {
            if (it.id !== id) return;
            if (b.dataset.act === 'tog') { it.d = !it.d; it.u = now; } else s.gone[id] = now;
          });
        });
      };
    });
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      var v = t.value.trim(); if (!v) return;
      t.value = '';
      change(function (s, now) {
        s.items.unshift({ id: now.toString(36) + Math.random().toString(36).slice(2, 6), t: kind, x: v.slice(0, MAX_LEN), c: color, d: false, a: me, ts: now, u: now });
      });
    };
  }
  var MAX_DRAWINGS = 3;
  function openPad() {
    var PENS = ['#ffffff', '#f2c230', '#5b92ff', '#ff6fb1', '#3ccf82', '#ff5f52'], SIZES = [4, 9, 18];
    var pen = PENS[1], size = SIZES[1], strokes = [], cur = null;
    var pad = document.createElement('div'); pad.className = 'pad';
    pad.innerHTML = '<div class="pad-top"><button class="ghost" id="pc">Cancel</button><h1 style="font-size:20px">Draw for the TV</h1><button class="primary" id="ps">Send</button></div>' +
      '<canvas id="cv" width="900" height="600"></canvas>' +
      '<div class="row"><div class="pens">' + PENS.map(function (c) { return '<button class="pen" data-c="' + c + '" aria-label="Pen color" aria-pressed="' + (c === pen) + '" style="background:' + c + '"></button>'; }).join('') + '</div>' +
      '<div class="sizes">' + SIZES.map(function (z) { return '<button data-z="' + z + '" aria-label="Pen size" aria-pressed="' + (z === size) + '"><span style="width:' + (z / 1.5 + 4) + 'px;height:' + (z / 1.5 + 4) + 'px"></span></button>'; }).join('') + '</div></div>' +
      '<div class="row"><button class="ghost" id="pu">Undo</button><button class="ghost" id="px">Clear</button></div>';
    document.body.appendChild(pad);
    var cv = pad.querySelector('#cv'), ctx = cv.getContext('2d');
    function redraw() {
      ctx.fillStyle = '#1d1f27'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokes.forEach(function (st) {
        ctx.strokeStyle = st.c; ctx.fillStyle = st.c; ctx.lineWidth = st.w; ctx.beginPath();
        if (st.p.length === 1) { ctx.arc(st.p[0][0], st.p[0][1], st.w / 2, 0, 7); ctx.fill(); return; }
        ctx.moveTo(st.p[0][0], st.p[0][1]);
        for (var i = 1; i < st.p.length; i++) ctx.lineTo(st.p[i][0], st.p[i][1]);
        ctx.stroke();
      });
    }
    function pt(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = { c: pen, w: size, p: [pt(e)] }; strokes.push(cur); redraw(); });
    cv.addEventListener('pointermove', function (e) { if (!cur) return; e.preventDefault(); cur.p.push(pt(e)); redraw(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { cur = null; }); });
    [].forEach.call(pad.querySelectorAll('.pen'), function (b) { b.onclick = function () { pen = b.dataset.c; [].forEach.call(pad.querySelectorAll('.pen'), function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    [].forEach.call(pad.querySelectorAll('.sizes button'), function (b) { b.onclick = function () { size = +b.dataset.z; [].forEach.call(pad.querySelectorAll('.sizes button'), function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    pad.querySelector('#pu').onclick = function () { strokes.pop(); redraw(); };
    pad.querySelector('#px').onclick = function () { strokes = []; redraw(); };
    pad.querySelector('#pc').onclick = function () { pad.remove(); };
    pad.querySelector('#ps').onclick = function () {
      if (!strokes.length) { pad.remove(); return; }
      var out = document.createElement('canvas'); out.width = 600; out.height = 400;
      out.getContext('2d').drawImage(cv, 0, 0, 600, 400);
      var data = out.toDataURL('image/jpeg', 0.7);
      pad.remove();
      change(function (s, now) {
        s.items.unshift({ id: now.toString(36) + Math.random().toString(36).slice(2, 6), t: 'img', img: data, a: me, ts: now, u: now });
      });
    };
    redraw();
  }
  function showStatus() {
    var el = document.getElementById('st'); if (!el) return;
    el.className = 'status' + (syncErr ? ' bad' : '');
    el.innerHTML = '<span class="dot"></span>' + (busy ? 'Saving…' : syncErr ? 'Can’t reach the TV channel. Check your connection.' : lastSync ? 'On the TV · synced ' + ago(lastSync) : 'Connecting…');
  }
  // Merge everything on the channel with this phone's copy, apply the change, publish.
  function trim(s, now) {
    var n = 0, k = 0;
    s.items.forEach(function (it) {
      if (s.gone[it.id]) return;
      if (it.t === 'img' && ++n > MAX_DRAWINGS) s.gone[it.id] = now;
      else if (++k > MAX_ITEMS) s.gone[it.id] = now;
    });
    s.items = s.items.filter(function (it) { return !s.gone[it.id]; });
  }
  function change(fn) {
    busy = true; showStatus();
    TVNotes.fetchMerged(cfg, state ? [state] : [], function (err, merged) {
      var s = JSON.parse(JSON.stringify(merged || TVNotes.merge(state ? [state] : [])));
      s.gone = s.gone || {};
      var now = Date.now();
      fn(s, now); trim(s, now);
      s.v = 1; s.rev = now; s.by = me;
      TVNotes.publish(cfg, s, function (e2) {
        busy = false; syncErr = !!e2;
        state = s; ls('tvn-cache', JSON.stringify(s));
        if (!e2) lastSync = Date.now();
        renderMain();
      });
    });
  }
  function same(a, b) { return JSON.stringify((a || {}).items || []) === JSON.stringify((b || {}).items || []); }
  function poll() {
    if (!cfg || busy) return;
    TVNotes.fetchMerged(cfg, state ? [state] : [], function (err, merged) {
      syncErr = !!err;
      if (!err) {
        lastSync = Date.now();
        if (!same(merged, state)) {
          state = merged; ls('tvn-cache', JSON.stringify(state));
          if (me && !(window.TVAsk && TVAsk.active) && document.activeElement !== document.getElementById('txt')) renderMain();
        }
      }
      showStatus();
    });
  }
  // Keep the unlock in the address so 'Add to Home Screen' saves an already-unlocked app.
  function keepHash() {
    if (!pass) return;
    var q = '?k=' + encodeURIComponent(pass) + (me ? '&me=' + encodeURIComponent(me) : '');

  }
